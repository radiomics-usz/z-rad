[pytest]
testpaths = tests

addopts =
    --benchmark-skip
    --strict-config
    --strict-markers
    --disable-warnings
    --tb=short
    -n auto
    --cov=zrad
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=0

markers =
    unit: Fast unit tests
    integration: Tests with external dependencies
    gui: GUI-related tests
    benchmark_slow: Expensive scaling and published IBSI performance workloads
    benchmark_exhaustive: IBSI II phase-I and phase-II workloads added by the exhaustive suite
    benchmark_ibsi: Published IBSI performance workloads
    benchmark_io: Noisy filesystem-inclusive performance workloads

norecursedirs = .git venv env coverage htmlcov reports
